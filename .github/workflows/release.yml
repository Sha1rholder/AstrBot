name: Release AstrBot

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/SHA)"
        required: false
        default: "master"
      tag:
        description: "Release tag to publish assets to (for example: v4.14.6)"
        required: false

permissions:
  contents: read

jobs:
  build-dashboard:
    name: Build Dashboard
    if: github.repository == 'AstrBotDevs/AstrBot'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.checkout.outputs.commit }}
    env:
      R2_ENABLED: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve tag
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-$(git describe --tags --abbrev=0)}"
          git check-ref-format "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$tag" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.0'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Build dashboard dist
        working-directory: dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          printf '%s\n' "$VERSION_TAG" > dist/assets/version
          zip -qr "AstrBot-$VERSION_TAG-dashboard.zip" dist

      - uses: actions/upload-artifact@v7
        with:
          name: Dashboard-${{ steps.tag.outputs.tag }}
          if-no-files-found: error
          compression-level: 0
          path: dashboard/AstrBot-${{ steps.tag.outputs.tag }}-dashboard.zip

      - name: Upload release packages to Cloudflare R2
        if: env.R2_ENABLED == 'true'
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

          dashboard="dashboard/AstrBot-$VERSION_TAG-dashboard.zip"
          core="AstrBot-$VERSION_TAG-core.zip"
          git archive --prefix="AstrBot-$VERSION_TAG/" --output="$core" HEAD

          for version in "$VERSION_TAG" latest; do
            rclone copyto "$dashboard" "r2:astrbot/astrbot-webui-$version.zip"
            rclone copyto "$core" "r2:astrbot/astrbot-core-$version.zip"
          done
          rclone copyto "$core" "r2:astrbot/astrbot-core/$VERSION_TAG/source.zip"
          rclone copyto "$core" "r2:astrbot/download/astrbot-core/$VERSION_TAG/source.zip"

  publish-release:
    name: Publish GitHub Release
    needs: build-dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build-dashboard.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-dashboard.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          name: Dashboard-${{ env.TAG }}
          path: release-assets

      - name: Publish dashboard to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if assets=$(gh release view "$TAG" --json assets --jq '.assets[].name'); then
            while IFS= read -r asset; do
              case "$asset" in
                *.AppImage|*.dmg|*.zip|*.exe|*.blockmap)
                  gh release delete-asset "$TAG" "$asset" -y || true
                  ;;
              esac
            done <<< "$assets"
          else
            notes=(--notes "Release $TAG")
            if [[ -f "changelogs/$TAG.md" ]]; then
              notes=(--notes-file "changelogs/$TAG.md")
            fi
            gh release create "$TAG" --title "$TAG" --target "$(git rev-parse HEAD)" "${notes[@]}"
          fi
          gh release upload "$TAG" "release-assets/AstrBot-$TAG-dashboard.zip" --clobber

  publish-pypi:
    name: Publish PyPI
    needs: [build-dashboard, publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-dashboard.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          name: Dashboard-${{ needs.build-dashboard.outputs.tag }}
          path: ${{ runner.temp }}/dashboard-artifact

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build package with dashboard assets
        env:
          TAG: ${{ needs.build-dashboard.outputs.tag }}
        run: |
          unzip -qo "$RUNNER_TEMP/dashboard-artifact/AstrBot-$TAG-dashboard.zip" -d astrbot/dashboard
          uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
